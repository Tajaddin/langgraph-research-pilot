[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "langgraph-research-pilot"
version = "0.1.0"
description = "Multi-step research agent in LangGraph with human-in-the-loop approval gates and SQLite checkpointing"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Tajaddin Gafarov", email = "gafarovtajaddin@gmail.com" }]
keywords = ["langgraph", "agent", "hitl", "rag", "llm", "research"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "langgraph==0.2.50",
    "langgraph-checkpoint-sqlite==2.0.4",
    "langchain-core==0.3.21",
    "pydantic==2.9.2",
    "httpx==0.27.2",
    "typing-extensions==4.15.0",
]

[project.optional-dependencies]
hf = ["huggingface-hub==0.26.2"]
anthropic = ["anthropic==0.39.0"]
groq = ["groq==0.11.0"]
ollama = ["ollama==0.3.3"]
ui = ["gradio==4.44.1"]
eval = ["datasets==2.21.0"]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "ruff==0.6.9",
    "mypy==1.13.0",
]

[project.scripts]
research-pilot = "langgraph_research_pilot.cli:main"

[project.urls]
Homepage = "https://github.com/Tajaddin/langgraph-research-pilot"
Repository = "https://github.com/Tajaddin/langgraph-research-pilot"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# app.py mutates sys.path for HuggingFace Spaces before importing the
# in-tree package, so imports cannot all sit at the top of the file.
"app.py" = ["E402"]
