[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "langgraph-research-pilot"
version = "0.1.0"
description = "Multi-step research agent in LangGraph with human-in-the-loop approval gates and SQLite checkpointing"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Tajaddin Gafarov", email = "gafarovtajaddin@gmail.com" }]
keywords = ["langgraph", "agent", "hitl", "rag", "llm", "research"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=2.0",
    "langchain-core>=0.3.0",
    "pydantic>=2.5",
    "httpx>=0.27",
    "typing-extensions>=4.9",
]

[project.optional-dependencies]
hf = ["huggingface-hub>=0.24"]
anthropic = ["anthropic>=0.39"]
groq = ["groq>=0.10"]
ollama = ["ollama>=0.3"]
ui = ["gradio>=4.40"]
eval = ["datasets>=2.20"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
research-pilot = "langgraph_research_pilot.cli:main"

[project.urls]
Homepage = "https://github.com/Tajaddin/langgraph-research-pilot"
Repository = "https://github.com/Tajaddin/langgraph-research-pilot"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
